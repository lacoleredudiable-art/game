name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  pr-kapisi:
    name: PR kapısı
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: OYUN.md üretim kontrolü
        run: python tools/gen-game-overview.py --check

      - name: Core testleri
        run: dotnet test tools/CoreTests

      - name: Integration testleri
        run: dotnet test tools/IntegrationTests

      - name: GameCompile (Game katmanı derlemesi)
        run: python tools/GameCompile/check.py

      - name: Bağımlılık haritası (C4, engellemez)
        continue-on-error: true
        run: |
          python -m unittest discover -s tools/DepMap -p 'test_*.py'
          python tools/DepMap/depmap.py --out depmap.txt
          { echo '### Bağımlılık haritası (C4)'; head -4 depmap.txt; } >> "$GITHUB_STEP_SUMMARY"
