name: CI

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    # Pazartesi 03:00 UTC: eski motor testleri + SweepV2.
    - cron: "0 3 * * 1"
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  pr-kapisi:
    name: PR kapısı
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: OYUN.md üretim kontrolü
        run: python tools/gen-game-overview.py --check

      - name: Core testleri (EskiMotor hariç)
        run: dotnet test tools/CoreTests --filter "TestCategory!=EskiMotor"

      - name: Integration testleri
        run: dotnet test tools/IntegrationTests

      - name: GameCompile (Game katmanı derlemesi)
        run: python tools/GameCompile/check.py

  # PlayMode: "O_" ölçü testleri + RuleEngineV4WorldPhysicsPlayModeTests (Gözcü duman testi dahil).
  # Gözcü cırcırı eşikleri tools/gozcu-esik.txt; rapor iş özetinde ve gozcu çıktısında.
  # Self-hosted Windows runner (etiket unity-win), yüklü Unity ve kullanıcının Unity lisansı.
  # Repo herkese açık: fork PR'ında koşmaz (repo ayarı da fork PR'ları için onay ister).
  # Library runner'ın checkout'unda kalıcı (checkout clean: false + Library hariç git clean).
  unity-kapisi:
    name: Unity kapısı
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name == 'push' && github.ref == 'refs/heads/master')
      || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, unity-win]
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell
    env:
      GOZCU_OUT: tools/verify-out/gozcu
      UNITY_OUT: unity-sonuc
    steps:
      - name: Önceki koşudan kalan Unity süreci (yalnız runner checkout'u)
        run: |
          $proj = Join-Path $env:GITHUB_WORKSPACE 'unity'
          Get-CimInstance Win32_Process -Filter "Name = 'Unity.exe'" |
            Where-Object { $_.CommandLine -and $_.CommandLine.Contains($proj) } |
            ForEach-Object { Write-Output "Kalan Unity süreci kapatılıyor: $($_.ProcessId)"; Stop-Process -Id $_.ProcessId -Force }

      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Checkout temizliği (Library kalır)
        run: |
          git clean -ffdx -e unity/Library/
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: PlayMode testleri
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          $ws = $env:GITHUB_WORKSPACE
          $ver = (Select-String -Path unity/ProjectSettings/ProjectVersion.txt -Pattern '^m_EditorVersion: (\S+)').Matches[0].Groups[1].Value
          $unity = "C:\Program Files\Unity\Hub\Editor\$ver\Editor\Unity.exe"
          if (-not (Test-Path $unity)) { Write-Output "::error title=Unity kapısı::Unity $ver yüklü değil: $unity"; exit 1 }
          New-Item -ItemType Directory -Force $env:UNITY_OUT, $env:GOZCU_OUT | Out-Null
          $results = Join-Path $ws "$env:UNITY_OUT\playmode-results.xml"
          $unityArgs = @(
            '-batchmode', '-projectPath', (Join-Path $ws 'unity'),
            '-runTests', '-testPlatform', 'PlayMode',
            '-testFilter', '\.O_;RuleEngineV4WorldPhysicsPlayModeTests\.',
            '-testResults', $results,
            '-logFile', (Join-Path $ws "$env:UNITY_OUT\playmode.log"),
            '-gozcuOut', (Join-Path $ws $env:GOZCU_OUT))
          Write-Output "Unity $ver : $unity"
          Write-Output "Proje: $(Join-Path $ws 'unity')"
          $p = Start-Process -FilePath $unity -ArgumentList $unityArgs -Wait -PassThru -NoNewWindow
          $code = $p.ExitCode
          if (-not (Test-Path $results)) { Write-Output "::error title=Unity kapısı::Sonuç XML'i yok (çıkış $code). playmode.log'a bak."; exit 1 }
          [xml]$x = Get-Content $results -Encoding UTF8
          $run = $x.'test-run'
          $sum = "toplam $($run.total), geçti $($run.passed), kaldı $($run.failed), atlandı $($run.skipped), $([int][double]$run.duration) sn"
          $failed = @($x.SelectNodes('//test-case[@result="Failed"]'))
          $lines = @('## Unity kapısı', '', $sum, '')
          foreach ($t in $failed) {
            $msg = ($t.failure.message.InnerText -split "`n" | Select-Object -First 6) -join "`n"
            $lines += "- **$($t.name)**", '```', $msg, '```'
            Write-Output "::error title=$($t.name)::$((($msg -split "`n") | Select-Object -First 1))"
          }
          $lines -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Write-Output $sum
          if ($code -ne 0) { Write-Output "Unity çıkış kodu $code (2 = test kaldı)"; exit 1 }

      - name: Gözcü cırcırı özeti
        if: always()
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          $rapor = Join-Path $env:GOZCU_OUT 'cirlik.txt'
          $lines = @('## Gözcü cırcırı', '')
          if (Test-Path $rapor) {
            $r = Get-Content $rapor -Encoding UTF8
            $lines += '```'
            $lines += $r
            $lines += '```'
            $r | Where-Object { $_ -like 'UYARI *' } | ForEach-Object { Write-Output "::warning title=Gözcü cırcırı::$_" }
            $r | Where-Object { $_ -like 'KIRMIZI *' } | ForEach-Object { Write-Output "::error title=Gözcü cırcırı::$_" }
          } else {
            $lines += 'cirlik.txt yok: duman testi koşmadı ya da bitmedi.'
          }
          $lines -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Kalan Unity sürecini kapat
        if: always()
        run: |
          $proj = Join-Path $env:GITHUB_WORKSPACE 'unity'
          Get-CimInstance Win32_Process -Filter "Name = 'Unity.exe'" |
            Where-Object { $_.CommandLine -and $_.CommandLine.Contains($proj) } |
            ForEach-Object { Stop-Process -Id $_.ProcessId -Force }

      - name: Test sonuçları (XML + log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-test-sonuclari
          path: unity-sonuc
          if-no-files-found: warn

      - name: Gözcü çıktısı (kontakt sayfası + gozcu.txt)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gozcu
          path: |
            tools/verify-out/gozcu/kontakt.png
            tools/verify-out/gozcu/gozcu.txt
            tools/verify-out/gozcu/senaryo.txt
            tools/verify-out/gozcu/cirlik.txt
          if-no-files-found: warn

  # Eski motoru korur; her PR'da koşmaz, engellemez (taşıma bitince kaldırılacak).
  eski-motor:
    name: Eski motor (haftalık, engellemez)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: EskiMotor testleri
        id: eskimotor
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p sweep-out
          dotnet test tools/CoreTests --filter "TestCategory=EskiMotor" 2>&1 | tee sweep-out/eskimotor.log

      - name: Başsız Play taraması (1440 kombo, kapı)
        id: sweep
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p sweep-out
          dotnet run --project tools/SweepV2 -c Release -- \
            --all --gate --quiet \
            --compare docs/play-sweep/pr35-final-4x.csv \
            --expect-sha256 @docs/play-sweep/headless-baseline.sha256 \
            --out sweep-out --label headless-tum 2>&1 | tee sweep-out/sweep.log

      - name: Skor tablosu
        if: always()
        env:
          ESKIMOTOR_OUTCOME: ${{ steps.eskimotor.outcome }}
          SWEEP_OUTCOME: ${{ steps.sweep.outcome }}
        run: |
          {
            echo "## EskiMotor testleri: ${ESKIMOTOR_OUTCOME} (engellemez)"
            echo
            echo '```'
            grep -E "(Passed!|Failed!|Başarılı!|Başarısız!)" sweep-out/eskimotor.log || echo "Test özeti yok."
            grep -E "^\s+(Failed|Başarısız) " sweep-out/eskimotor.log || true
            echo '```'
            echo
            echo "## SweepV2 kapısı: ${SWEEP_OUTCOME} (engellemez)"
            echo
            if [ -f sweep-out/sweep.log ]; then
              echo '```'
              grep -A 20 -E "Normalize sweep hash uyuşmuyor" sweep-out/sweep.log || echo "Normalize sweep hash: eşleşti"
              grep -A 50 -E "^KAPI KALDI:" sweep-out/sweep.log || grep -E "^KAPI GEÇTİ" sweep-out/sweep.log || echo "Kapı sonucu yok (tarama tamamlanmadı)"
              echo '```'
            else
              echo "sweep.log yok: tarama başlamadı."
            fi
            echo
            if [ -f sweep-out/headless-tum-ozet.md ]; then
              cat sweep-out/headless-tum-ozet.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${ESKIMOTOR_OUTCOME}" = "failure" ]; then
            echo "::warning title=EskiMotor::Eski motor testleri kaldı (engellemez). Ayrıntı job summary'de."
          fi
          if [ "${SWEEP_OUTCOME}" = "failure" ]; then
            echo "::warning title=SweepV2::Hash/144 kapısı kaldı (engellemez). Ayrıntı job summary'de."
          fi

      - name: CSV + detay
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eski-motor
          path: sweep-out/
          if-no-files-found: warn
